name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ master, main ]       # triggers on pushes to master or main
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '0 6 * * *'              # daily run at 6:00 AM UTC

jobs:
  build-and-test:
    name: 🧪 Build & Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.18'

      - name: ⚙️ Cache Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: ⚙️ Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest dvc[s3]

      - name: 🧠 Run Unit Tests (skip if none)
        run: |
          if [ -d "tests" ]; then
            pytest tests/ --maxfail=1 --disable-warnings -q
          else
            echo "⚠️ No tests directory found. Skipping tests."

  run-pipeline-container:
    name: 🚀 Run Full MLOps Pipeline via Docker
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Pull Prebuilt Docker Image
        run: |
          echo "🛠️ Pulling latest image from DockerHub..."
          docker pull sumitdohanropar/mtp:latest

      - name: 📦 Optional DVC Pull
        run: |
          if [ -f ".dvc/config" ]; then
            echo "📡 DVC remote found — pulling data..."
            dvc pull || echo "⚠️ DVC pull failed or no data — continuing."
          else
            echo "ℹ️ No DVC remote configured — skipping."

      - name: 🧩 Run Pipeline in Container (CI Mode)
        run: |
          echo "🚀 Running full MLOps pipeline inside Docker container..."
          docker run --rm \
            -e CI=true \
            -e USE_DVC=false \
            -v ${{ github.workspace }}/data:/app/data \
            -v ${{ github.workspace }}/src/mlruns:/app/mlruns \
            -v ${{ github.workspace }}/.dvc:/app/.dvc \
            sumitdohanropar/mtp:latest \
            bash -c "\
              echo '📥 Running Ingestion...' && python src/components/ingestion.py || echo '⚠️ Ingestion failed'; \
              echo '🔄 Running Preprocessing...' && python src/components/preprocessing.py || echo '⚠️ Preprocessing failed'; \
              echo '🧠 Running Model...' && python src/components/model.py || echo '⚠️ Model failed'; \
              echo '📊 Running Feature Extraction...' && python src/components/feature.py || echo '⚠️ Feature extraction failed'; \
              echo '✅ Pipeline completed (CI mode, servers skipped)'"

      - name: 📦 Upload MLflow Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-logs
          path: src/mlruns/
          if-no-files-found: ignore

      - name: 📊 Upload Processed Data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: src/data/processed/
          if-no-files-found: ignore
