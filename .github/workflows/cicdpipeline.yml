name: MLOps CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:    # ✅ Manual trigger
  schedule:
    - cron: '0 6 * * *' # daily 6 AM UTC

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  build-and-test:
    name: 🧪 Build & Dependency Setup
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ Cache Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: ⚙️ Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc[s3]

      - name: ⏭️ Skip Tests
        run: echo "Skipping unit tests (no tests configured)."

  run-pipeline-container:
    name: 🚀 Run Full MLOps Pipeline via Docker
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Pull Prebuilt Docker Image
        run: docker pull sumitdohanropar/mtp:latest

      - name: 📦 Optional DVC Pull
        run: |
          if [ -f ".dvc/config" ]; then
            echo "📡 DVC remote found — pulling data..."
            dvc pull || echo "⚠️ DVC pull failed or no data — continuing anyway."
          else
            echo "ℹ️ No DVC remote configured — skipping."
          fi

      - name: 🧩 Run MLOps Pipeline in Container
        run: |
          docker run --rm \
            -e CI=true \
            -e USE_DVC=false \
            -p 8081:8081 \
            -v ${{ github.workspace }}/data:/app/data \
            -v ${{ github.workspace }}/src/mlruns:/app/mlruns \
            -v ${{ github.workspace }}/.dvc:/app/.dvc \
            sumitdohanropar/mtp:latest \
            bash -c "\
              python src/components/ingestion.py && \
              python src/components/preprocessing.py && \
              python src/components/model.py && \
              python src/components/feature.py && \
              uvicorn src.api.main:app --host 0.0.0.0 --port 8081 & \
              sleep 15 && curl http://localhost:8081/health"

      - name: 📦 Upload MLflow Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-logs
          path: src/mlruns/
          if-no-files-found: ignore

      - name: 📊 Upload Processed Data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: src/data/processed/
          if-no-files-found: ignore
