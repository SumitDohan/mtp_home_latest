name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 6 * * *'  # runs daily at 6:00 AM UTC

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10.18'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Unit Tests (skip if no tests)
        run: |
          if [ -d "tests" ]; then
            pytest tests/ --maxfail=1 --disable-warnings -q
          else
            echo "No tests directory found. Skipping tests."
          fi

  run-container-from-dockerhub:
    name: Pull & Run Prebuilt Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull Existing Docker Image
        run: |
          docker pull sumitdohanropar/mtp:latest

      - name: Run Container
        run: |
          docker run --rm \
            -e ENV=prod \
            -v ${{ github.workspace }}/src:/app/src \
            sumitdohanropar/mtp:latest \
            bash -c "python src/components/ingestion.py && python src/components/preprocessing.py && python src/components/model.py && python src/components/feature.py"
