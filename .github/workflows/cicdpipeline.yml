name: MLOps CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # daily 6 AM UTC

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  build-and-test:
    name: 🧪 Build & Dependency Setup
    runs-on: self-hosted   # ✅ use your local runner (sudeepta-PowerEdge-R760)
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ Cache Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: ⚙️ Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc[s3]

      - name: ⏭️ Skip Tests
        run: echo "Skipping unit tests (no tests configured)."

  run-pipeline-container:
    name: 🚀 Build, Push, and Test Docker Pipeline
    runs-on: self-hosted   # ✅ runs directly on your local machine
    needs: build-and-test
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Login to DockerHub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: 🏗️ Build Docker Image
        run: |
          docker build -t sumitdohanropar/mtp:latest .

      - name: 🐳 Push Docker Image
        run: |
          docker push sumitdohanropar/mtp:latest

      - name: 📦 Optional DVC Pull
        run: |
          python -m pip install dvc[s3]
          if [ -f ".dvc/config" ]; then
            echo "📡 DVC remote found — pulling data..."
            dvc pull || echo "⚠️ DVC pull failed or no data — continuing anyway."
          else
            echo "ℹ️ No DVC remote configured — skipping."
          fi

      - name: 🧩 Test Pipeline in Container
        run: |
          docker run --rm \
            -e CI=true \
            -e USE_DVC=false \
            -p 8081:8081 \
            -v ${{ github.workspace }}/data:/app/data \
            -v ${{ github.workspace }}/src/mlruns:/app/mlruns \
            sumitdohanropar/mtp:latest \
            bash -c "\
              echo '🏁 Running MLOps pipeline...' && \
              python src/components/ingestion.py && \
              python src/components/preprocessing.py && \
              python src/components/model.py && \
              python src/components/feature.py && \
              echo '✅ CI test complete'
            "

  deploy-to-local:
    name: 🚀 Deploy to Local Server (172.26.1.219)
    runs-on: self-hosted   # ✅ also run this on your local self-hosted runner
    needs: run-pipeline-container
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧠 SSH Deploy on Local Host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 172.26.1.219
          username: sweta
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 Pulling latest Docker image..."
            sudo docker pull sumitdohanropar/mtp:latest

            echo "🧹 Cleaning up old containers..."
            sudo docker stop mtp_local || true
            sudo docker rm mtp_local || true

            echo "🧩 Starting new container..."
            sudo docker run -d \
              --name mtp_local \
              -e CI=false \
              -e USE_DVC=false \
              -p 8081:8081 \
              -p 5050:5050 \
              -v /home/sweta/mtp_home_latest/mtp_home_latest/src/data:/app/src/data \
              -v /home/sweta/mtp_home_latest/mtp_home_latest/src/mlruns:/app/src/mlruns \
              sumitdohanropar/mtp:latest

            echo "✅ Deployment completed successfully."
