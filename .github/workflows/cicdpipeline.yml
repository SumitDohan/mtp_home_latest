name: MLOps CI/CD Pipeline (Pull Image — Use Prepopulated Python)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # daily 6 AM UTC

permissions:
  contents: read
  id-token: write
  actions: read

env:
  PYTHON_VERSION: '3.10'
  WHEELHOUSE_DIR: '.wheelhouse'
  IMAGE_NAME: 'sumitdohanropar/mtp:latest'
  LOCAL_WHEEL_CACHE: '/home/sweta/.cache/mtp_wheelhouse'

jobs:
  build-and-test:
    name: 🧪 Build & Dependency Setup
    runs-on: [self-hosted, prepopulated-python]

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧼 Ensure workspace ownership (prevent permission errors)
        run: |
          # make workspace writable by the runner user so cleanup and checkout succeed
          sudo chown -R $(id -u):$(id -g) "${{ github.workspace }}" || true
          sudo chmod -R u+rwX "${{ github.workspace }}" || true

      - name: 🗄️ Restore pip cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pypoetry
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}-${{ env.PYTHON_VERSION }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-

      - name: 🐍 Use prepopulated Python from self-hosted runner
        shell: bash
        run: |
          TOOL_DIR="${RUNNER_TOOL_CACHE:-/home/sweta/mtp_home_latest/mtp_home_latest/actions-runner/_work/_tool}/Python/3.10.19/x64"
          echo "Using prepopulated Python at: $TOOL_DIR"
          if [ -x "$TOOL_DIR/bin/python" ]; then
            export PATH="$TOOL_DIR/bin:$PATH"
            python --version
            pip --version
          else
            echo "ERROR: No cached python found at $TOOL_DIR/bin/python"
            ls -la "$(dirname "$TOOL_DIR")" || true
            exit 1
          fi

      - name: ⚙️ Upgrade pip & wheel
        run: python -m pip install --upgrade pip wheel setuptools

      - name: 🔁 Prepare local persistent wheelhouse
        run: |
          mkdir -p "${{ env.LOCAL_WHEEL_CACHE }}" "${{ env.WHEELHOUSE_DIR }}"
          echo "Local persistent wheel dir: ${{ env.LOCAL_WHEEL_CACHE }}"
          if [ -d "${{ env.LOCAL_WHEEL_CACHE }}" ] && [ -n "$(ls -A ${{ env.LOCAL_WHEEL_CACHE }} 2>/dev/null)" ]; then
            echo "✅ Found cached wheels — copying to workspace..."
            cp -a "${{ env.LOCAL_WHEEL_CACHE }}"/* "${{ env.WHEELHOUSE_DIR }}/" || true
          else
            echo "🆕 No local wheel cache found, will build fresh wheels."
          fi

      - name: 🛠️ Build wheelhouse (if missing wheels)
        run: |
          if [ -z "$(ls -A ${{ env.WHEELHOUSE_DIR }} 2>/dev/null)" ]; then
            echo "Building new wheelhouse..."
            mkdir -p ${{ env.WHEELHOUSE_DIR }}
            if [ -f requirements.txt ]; then
              pip wheel -r requirements.txt -w ${{ env.WHEELHOUSE_DIR }}
            fi
            mkdir -p "${{ env.LOCAL_WHEEL_CACHE }}"
            cp -a ${{ env.WHEELHOUSE_DIR }}/* "${{ env.LOCAL_WHEEL_CACHE }}/" || true
          else
            echo "Using existing wheels from local cache."
          fi
          echo "Final wheelhouse content:"
          ls -lh ${{ env.WHEELHOUSE_DIR }} || true

      - name: 🧩 Install Dependencies (prefer wheelhouse)
        run: |
          if [ -d "${{ env.WHEELHOUSE_DIR }}" ] && [ -n "$(ls -A ${{ env.WHEELHOUSE_DIR }} 2>/dev/null)" ]; then
            pip install --no-index --find-links=${{ env.WHEELHOUSE_DIR }} -r requirements.txt
          else
            pip install -r requirements.txt
          fi
          pip install dvc[s3]

      - name: ⏭️ Skip Tests
        run: echo "Skipping unit tests (no tests configured)."

  run-pipeline-container:
    name: 🚀 Pull, Test Docker Image
    runs-on: [self-hosted, prepopulated-python]
    needs: build-and-test
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧼 Ensure workspace ownership (prevent permission errors)
        run: |
          sudo chown -R $(id -u):$(id -g) "${{ github.workspace }}" || true
          sudo chmod -R u+rwX "${{ github.workspace }}" || true

      - name: 🔁 Restore local persistent wheelhouse
        run: |
          mkdir -p wheelhouse
          if [ -d "${{ env.LOCAL_WHEEL_CACHE }}" ] && [ -n "$(ls -A ${{ env.LOCAL_WHEEL_CACHE }} 2>/dev/null)" ]; then
            echo "✅ Copying wheels from local runner cache..."
            cp -a "${{ env.LOCAL_WHEEL_CACHE }}"/* wheelhouse/ || true
          else
            echo "⚠️ No local wheel cache found; proceeding without wheels."
          fi
          ls -lh wheelhouse || true

      - name: 🔑 Login to Docker registry (optional for private images)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "${DOCKER_USERNAME:-}" ] && [ -n "${DOCKER_PASSWORD:-}" ]; then
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          else
            echo "No Docker credentials provided — attempting anonymous pull (image must be public)."
          fi

      - name: 📥 Pull prebuilt Docker image
        run: |
          echo "Pulling image: $IMAGE_NAME"
          docker pull "$IMAGE_NAME"
          docker images | grep "$(echo $IMAGE_NAME | cut -d: -f1)" || true

      - name: 🧠 Test MLOps Pipeline inside pulled container (safe stop/start, run as runner user)
        run: |
          set -euxo pipefail

          CI_CONTAINER="mtp_ci_${{ github.run_id }}"
          PREV_STOPPED=()

          echo "Checking for containers using ports 8081 or 5050 and stopping them (recording for restart)..."
          for p in 8081 5050; do
            # collect container IDs that publish this host port (returns IDs only)
            mapfile -t ids < <(docker ps --filter "publish=${p}" -q || true)
            for cid in "${ids[@]:-}"; do
              if [ -n "$cid" ]; then
                echo "Stopping container $cid (holds host port $p)"
                PREV_STOPPED+=("$cid")
                docker stop "$cid" || true
              fi
            done
          done

          echo "CI will run as container name: $CI_CONTAINER"
          # run container as runner user to avoid root-owned files on mounted volumes
          docker run --name "$CI_CONTAINER" --user "$(id -u):$(id -g)" \
            -e CI=true \
            -e USE_DVC=false \
            -v "${{ github.workspace }}/data":/app/data \
            -v "${{ github.workspace }}/src/mlruns":/app/mlruns \
            -v "${{ github.workspace }}/wheelhouse":/app/wheelhouse:ro \
            $IMAGE_NAME \
            bash -c "\
              echo '🏁 Running pipeline from pulled image...' && \
              if [ -d /app/wheelhouse ]; then \
                pip install --no-index --find-links=/app/wheelhouse -r /app/requirements.txt || true; \
              fi && \
              python src/components/ingestion.py || exit 2 && \
              python src/components/preprocessing.py || exit 3 && \
              python src/components/model.py || exit 4 && \
              python src/components/feature.py || exit 5 && \
              echo '✅ CI smoke tests complete' \
            " || true

          # Inspect container exit status and logs
          EXIT_CODE=$(docker inspect "$CI_CONTAINER" --format '{{.State.ExitCode}}' 2>/dev/null || echo "unknown")
          echo "Container exit code: $EXIT_CODE"
          echo "===== tail of container logs ====="
          docker logs --tail 500 "$CI_CONTAINER" || true
          echo "===== end logs ====="

          if [ "$EXIT_CODE" != "0" ] && [ "$EXIT_CODE" != "unknown" ]; then
            echo "Container failed with exit code $EXIT_CODE — collecting artifacts and restoring previous containers..."
            mkdir -p ci_artifacts || true
            docker cp "$CI_CONTAINER":/app ci_artifacts || true

            # restart previously stopped containers (iterate over captured IDs)
            for cid in "${PREV_STOPPED[@]:-}"; do
              if [ -n "$cid" ]; then
                echo "Restarting previously stopped container $cid"
                docker start "$cid" || true
              fi
            done

            # preserve the failed container for inspection and fail the job
            exit "$EXIT_CODE"
          fi

          # success path: remove CI container and restart any previous containers
          docker rm -f "$CI_CONTAINER" || true
          for cid in "${PREV_STOPPED[@]:-}"; do
            if [ -n "$cid" ]; then
              echo "Restarting previously stopped container $cid"
              docker start "$cid" || true
            fi
          done

  deploy-to-local:
    name: 🚀 Deploy to Local Server (172.26.1.219)
    runs-on: [self-hosted, prepopulated-python]
    needs: run-pipeline-container
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧠 SSH Deploy on Local Host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 172.26.1.219
          username: sweta
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 Pulling latest Docker image..."
            sudo docker pull $IMAGE_NAME

            echo "🧹 Cleaning up old containers..."
            sudo docker stop mtp_local || true
            sudo docker rm mtp_local || true

            echo "🧩 Starting new container..."
            sudo docker run -d \
              --name mtp_local \
              -e CI=false \
              -e USE_DVC=false \
              -p 8081:8081 \
              -p 5050:5050 \
              -v /home/sweta/mtp_home_latest/mtp_home_latest/src/data:/app/src/data \
              -v /home/sweta/mtp_home_latest/mtp_home_latest/src/mlruns:/app/src/mlruns \
              $IMAGE_NAME

            echo "✅ Deployment completed successfully."
