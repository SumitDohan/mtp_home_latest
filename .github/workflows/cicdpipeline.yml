name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 6 * * *'  # runs daily at 6:00 AM UTC

jobs:
  build-and-test:
    name: 🧪 Build & Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.18'

      - name: ⚙️ Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 🧠 Run Unit Tests (skip if none)
        run: |
          if [ -d "tests" ]; then
            pytest tests/ --maxfail=1 --disable-warnings -q
          else
            echo "⚠️ No tests directory found. Skipping tests."
          fi

  run-pipeline-container:
    name: 🚀 Run Full MLOps Pipeline via Docker
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Pull Prebuilt Docker Image
        run: |
          echo "🛠️ Pulling the latest image from DockerHub..."
          docker pull sumitdohanropar/mtp:latest

      - name: 🧩 Run Pipeline in Container (CI Mode)
        run: |
          echo "🚀 Running complete MLOps pipeline inside container..."
          docker run --rm \
            -e CI=true \
            -e USE_DVC=false \
            -v ${{ github.workspace }}/data:/app/data \
            -v ${{ github.workspace }}/src/mlruns:/app/mlruns \
            sumitdohanropar/mtp:latest

      - name: 📦 Upload MLflow Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-logs
          path: src/mlruns/
          if-no-files-found: ignore

      - name: 📊 Upload Processed Data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: src/data/processed/
          if-no-files-found: ignore
