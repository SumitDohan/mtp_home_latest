name: MLOps CI/CD Pipeline (Pull Image)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # daily 6 AM UTC

permissions:
  contents: read
  id-token: write
  actions: read

env:
  PYTHON_VERSION: '3.10'
  WHEELHOUSE_DIR: '.wheelhouse'
  # IMAGE_NAME can be a tag (e.g. myorg/mtp:latest) or a digest (recommended for reproducibility)
  IMAGE_NAME: 'sumitdohanropar/mtp:latest'

jobs:
  build-and-test:
    name: 🧪 Build & Dependency Setup
    runs-on: self-hosted
    outputs:
      wheel-artifact: ${{ steps.upload-wheelhouse.outputs.artifact-path || '' }}
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🗄️ Restore pip cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pypoetry
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}-${{ env.PYTHON_VERSION }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: ⚙️ Upgrade pip & wheel
        run: python -m pip install --upgrade pip wheel setuptools

      - name: 🛠️ Build wheelhouse (binary wheels)
        run: |
          rm -rf ${{ env.WHEELHOUSE_DIR }}
          mkdir -p ${{ env.WHEELHOUSE_DIR }}
          if [ -f requirements.txt ]; then
            pip wheel -r requirements.txt -w ${{ env.WHEELHOUSE_DIR }} || true
          fi

      - name: 🧩 Install Dependencies (prefer wheelhouse)
        run: |
          if [ -d "${{ env.WHEELHOUSE_DIR }}" ] && [ -n "$(ls -A ${{ env.WHEELHOUSE_DIR }} 2>/dev/null)" ]; then
            pip install --no-index --find-links=${{ env.WHEELHOUSE_DIR }} -r requirements.txt
          else
            pip install -r requirements.txt
          fi
          pip install dvc[s3]

      - name: ⏭️ Skip Tests
        run: echo "Skipping unit tests (no tests configured)."

      - name: 📦 Upload wheelhouse artifact
        if: always()
        uses: actions/upload-artifact@v4
        id: upload-wheelhouse
        with:
          name: wheelhouse
          path: ${{ env.WHEELHOUSE_DIR }}

  run-pipeline-container:
    name: 🚀 Pull, Test Docker Image
    runs-on: self-hosted
    needs: build-and-test
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Download wheelhouse artifact
        uses: actions/download-artifact@v4
        with:
          name: wheelhouse
          path: wheelhouse || true

      - name: 🔑 Login to Docker registry (optional for private images)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "${DOCKER_USERNAME:-}" ] && [ -n "${DOCKER_PASSWORD:-}" ]; then
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          else
            echo "No Docker credentials provided — attempting anonymous pull (image must be public)."
          fi

      - name: 📥 Pull prebuilt Docker image
        run: |
          echo "Pulling image: $IMAGE_NAME"
          docker pull "$IMAGE_NAME"
          docker images | grep "$(echo $IMAGE_NAME | cut -d: -f1)" || true

      - name: 🧠 Test MLOps Pipeline inside pulled container (non-blocking)
        run: |
          # If your image already contains all dependencies, no additional install is required.
          # If you produced a wheelhouse in build-and-test and want to install it into the pulled image,
          # mount the wheelhouse and install from it (optional).
          docker run --rm \
            -e CI=true \
            -e USE_DVC=false \
            -p 8081:8081 \
            -v ${{ github.workspace }}/data:/app/data \
            -v ${{ github.workspace }}/src/mlruns:/app/mlruns \
            -v ${{ github.workspace }}/wheelhouse:/app/wheelhouse:ro \
            $IMAGE_NAME \
            bash -c "\
              echo '🏁 Running pipeline from pulled image...' && \
              if [ -d /app/wheelhouse ]; then \
                # only run this if your image expects installation from external wheelhouse
                pip install --no-index --find-links=/app/wheelhouse -r /app/requirements.txt || true; \
              fi && \
              python src/components/ingestion.py || true && \
              python src/components/preprocessing.py || true && \
              python src/components/model.py || true && \
              python src/components/feature.py || true && \
              echo '✅ CI smoke tests complete' \
            "

  deploy-to-local:
    name: 🚀 Deploy to Local Server (172.26.1.219)
    runs-on: self-hosted
    needs: run-pipeline-container
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧠 SSH Deploy on Local Host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 172.26.1.219
          username: sweta
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 Pulling latest Docker image..."
            sudo docker pull $IMAGE_NAME

            echo "🧹 Cleaning up old containers..."
            sudo docker stop mtp_local || true
            sudo docker rm mtp_local || true

            echo "🧩 Starting new container..."
            sudo docker run -d \
              --name mtp_local \
              -e CI=false \
              -e USE_DVC=false \
              -p 8081:8081 \
              -p 5050:5050 \
              -v /home/sweta/mtp_home_latest/mtp_home_latest/src/data:/app/src/data \
              -v /home/sweta/mtp_home_latest/mtp_home_latest/src/mlruns:/app/src/mlruns \
              $IMAGE_NAME

            echo "✅ Deployment completed successfully."
