name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 6 * * *'  # runs daily at 6:00 AM UTC

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.18'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Unit Tests (skip if no tests)
        run: |
          if [ -d "tests" ]; then
            pytest tests/ --maxfail=1 --disable-warnings -q
          else
            echo "⚠️ No tests directory found. Skipping tests."
          fi

  run-container-from-dockerhub:
    name: Pull & Run Prebuilt Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull Existing Docker Image
        run: |
          echo "🛠️ Pulling latest image from DockerHub..."
          docker pull sumitdohanropar/mtp:latest

      - name: Run MLOps Pipeline in Container
        run: |
          echo "🚀 Running MLOps pipeline inside container..."
          docker run --rm \
            -e ENV=prod \
            -v ${{ github.workspace }}:/app/mtp_home_latest \
            sumitdohanropar/mtp:latest \
            bash -c "cd /app/mtp_home_latest/src && \
                     python components/ingestion.py && \
                     python components/preprocessing.py && \
                     python components/model.py && \
                     python components/feature.py"

      - name: Upload MLflow logs (mlruns)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-logs
          path: src/mlruns/
          if-no-files-found: ignore
